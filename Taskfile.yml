version: '3'

tasks:
  setup:
    desc: ติดตั้งไลบรารีทั้งหมดของ Backend และ Frontend
    cmds:
      - cmd: go get go.mongodb.org/mongo-driver/mongo
        dir: backend
      - cmd: go mod tidy
        dir: backend
      - cmd: npm install @xyflow/react @dagrejs/dagre
        dir: frontend

  db:
    desc: เปิดใช้งานฐานข้อมูล MongoDB ผ่าน Docker
    cmds:
      - docker start soc-mongo || docker run -d --name soc-mongo -p 27017:27017 mongo:7

  backend:
    desc: รันเซิร์ฟเวอร์ Go Backend
    dir: backend
    cmds:
      - go run .

  frontend:
    desc: รันหน้าเว็บ React Frontend
    dir: frontend
    cmds:
      - npm run dev

  dev:
    desc: รันฐานข้อมูลและเปิดระบบทั้งหมดพร้อมกัน
    deps: [db]
    cmds:
      - task: ParallelRun

  ParallelRun:
    deps: [backend, frontend]